    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #0f172a;
            --secondary-color: #334155;
            --accent-color: #0ea5e9;
            --bg-color: #f8fafc;
            --text-color: #334155;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --badge-bg: #f1f5f9;
            --badge-text: #475569;
            --header-bg: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --nav-bg: rgba(15, 23, 42, 0.95);
        }

        body.dark-mode {
            --primary-color: #38bdf8;
            --secondary-color: #7dd3fc;
            --accent-color: #0ea5e9;
            --bg-color: #0f172a;
            --text-color: #cbd5e1;
            --card-bg: #1e293b;
            --border-color: #334155;
            --badge-bg: #334155;
            --badge-text: #e2e8f0;
            --header-bg: linear-gradient(135deg, #020617 0%, #0f172a 100%);
            --nav-bg: rgba(2, 6, 23, 0.95);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        /* Gestion de l'affichage FR / EN */
        html[lang="fr"] .en { display: none !important; }
        html[lang="en"] .fr { display: none !important; }

        body {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3, h4, h5, h6 { font-family: 'Poppins', sans-serif; }

        a:focus-visible, button:focus-visible {
            outline: 2px dashed var(--accent-color); outline-offset: 4px; border-radius: 4px;
        }

        /* Navigation fixe */
        nav {
            position: sticky; top: 0; z-index: 1000;
            background-color: var(--nav-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        .nav-links { display: flex; gap: 2rem; list-style: none; }
        .nav-links a {
            color: #ffffff; text-decoration: none; font-weight: 500; font-size: 0.95rem;
            transition: color 0.2s ease; letter-spacing: 0.5px;
        }
        .nav-links a:hover, .nav-links a:focus { color: var(--accent-color); }
        .nav-actions { display: flex; gap: 1rem; align-items: center; }

        .header-btn {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            color: white; padding: 0.5rem 1rem; border-radius: 20px; cursor: pointer;
            font-size: 0.85rem; font-family: 'Inter', sans-serif; font-weight: 500; transition: all 0.3s ease;
        }
        .header-btn:hover { background: rgba(255, 255, 255, 0.2); transform: scale(1.05); }

        /* Header */
        header {
            background: var(--header-bg); color: white; padding: 5rem 1.5rem 6rem;
            text-align: center; position: relative; overflow: hidden;
        }
        .profile-photo {
            width: 180px; height: 180px; border-radius: 50%; object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.1); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            margin: 0 auto 1.5rem auto; display: block; transition: transform 0.3s ease;
        }
        .profile-photo:hover { transform: scale(1.05); }
        header h1 { font-size: 3.5rem; font-weight: 700; letter-spacing: -1px; margin-bottom: 0.5rem; }
        header h2 { color: var(--accent-color); font-weight: 500; font-size: 1.5rem; margin-bottom: 1.5rem; }

        .contact-info { display: flex; justify-content: center; flex-wrap: wrap; gap: 1.5rem; font-size: 1rem; opacity: 0.9; }
        .contact-info a { color: white; text-decoration: none; border-bottom: 1px dotted rgba(255,255,255,0.4); transition: border-bottom 0.3s ease; }
        .contact-info a:hover { border-bottom: 1px solid white; }

        .header-buttons { display: flex; justify-content: center; gap: 1.25rem; flex-wrap: wrap; margin-top: 2.5rem; }
        .btn {
            display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.8rem 2rem; border-radius: 9999px;
            text-decoration: none; font-weight: 600; font-family: 'Inter', sans-serif; font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; border: none;
        }
        .btn-linkedin { background-color: #0077b5; color: white; box-shadow: 0 4px 15px rgba(0, 119, 181, 0.4); }
        .btn-cv { background-color: var(--accent-color); color: white; box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4); }
        .btn:hover { transform: translateY(-3px); filter: brightness(1.1); }

        /* KPI Banner */
        .kpi-banner {
            max-width: 1100px; margin: -3rem auto 3rem; background: var(--card-bg); border-radius: 16px;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; padding: 2.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-color); position: relative; z-index: 10;
        }
        .kpi-item { text-align: center; }
        .kpi-number { font-family: 'Poppins', sans-serif; font-size: 2.5rem; font-weight: 800; color: var(--accent-color); line-height: 1.2; margin-bottom: 0.25rem; }
        .kpi-label { font-size: 0.95rem; font-weight: 500; color: var(--secondary-color); text-transform: uppercase; letter-spacing: 0.5px; }

        .container { max-width: 1000px; margin: 0 auto 2rem; padding: 0 1.5rem; }
        section { margin-bottom: 4rem; scroll-margin-top: 6rem; }
        h3 { color: var(--primary-color); font-size: 2rem; margin-bottom: 2rem; display: flex; align-items: center; gap: 1rem; }
        h3::after { content: ''; flex: 1; height: 3px; background: linear-gradient(to right, var(--accent-color), transparent); border-radius: 2px; opacity: 0.5; }

        /* Scroll Reveal Animation */
        .reveal {
            opacity: 0; transform: translateY(30px);
            transition: opacity 0.8s cubic-bezier(0.5, 0, 0, 1), transform 0.8s cubic-bezier(0.5, 0, 0, 1);
            will-change: opacity, transform;
        }
        .reveal.active { opacity: 1; transform: translateY(0); }

        /* Etudes de cas (Projets Phares) */
        .case-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
        .case-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); transition: all 0.3s ease; cursor: pointer; position: relative;
            overflow: hidden;
        }
        .case-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--accent-color);
        }
        .case-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); border-color: var(--accent-color); }
        .case-card h4 { color: var(--primary-color); font-size: 1.25rem; margin-bottom: 0.5rem; }
        .case-card p { color: var(--secondary-color); font-size: 0.95rem; margin-bottom: 1.5rem; }
        .case-card .read-more {
            color: var(--accent-color); font-weight: 600; font-size: 0.9rem; text-transform: uppercase;
            display: flex; align-items: center; gap: 0.5rem;
        }

        /* Modales */
        .modal {
            display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6); backdrop-filter: blur(5px); align-items: center; justify-content: center;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px;
            padding: 2.5rem; width: 90%; max-width: 700px; position: relative; max-height: 90vh; overflow-y: auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .close { position: absolute; top: 1.5rem; right: 1.5rem; font-size: 1.5rem; cursor: pointer; color: var(--secondary-color); transition: color 0.2s; }
        .close:hover { color: var(--accent-color); }
        .modal-content h4 { font-size: 1.5rem; color: var(--primary-color); margin-bottom: 1.5rem; border-bottom: 2px solid var(--border-color); padding-bottom: 0.5rem; }
        
        .modal-section { margin-bottom: 1.5rem; }
        .modal-section h5 { color: var(--accent-color); font-size: 1.1rem; margin-bottom: 0.5rem; }
        .modal-section p { font-size: 0.95rem; color: var(--text-color); }

        /* Formulaire de contact */
        .form-group { margin-bottom: 1.5rem; }
        .form-control {
            width: 100%; padding: 0.8rem 1rem; border-radius: 8px; border: 1px solid var(--border-color);
            background: var(--bg-color); color: var(--text-color); font-family: 'Inter', sans-serif; font-size: 0.95rem;
        }
        .form-control:focus { outline: 2px solid var(--accent-color); border-color: transparent; }

        /* Badges & Skills */
        .skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
        .skill-box {
            background: var(--card-bg); padding: 2.5rem; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color); transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .skill-box:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        .skill-box h4 { color: var(--primary-color); font-size: 1.25rem; margin-bottom: 1.5rem; }
        .badge-container { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1rem; }
        .badge {
            background-color: var(--badge-bg); color: var(--badge-text); padding: 0.4rem 0.85rem; border-radius: 8px;
            font-size: 0.85rem; font-weight: 600; border: 1px solid var(--border-color); display: inline-block; transition: all 0.2s ease;
        }
        .badge-accent { background-color: rgba(14, 165, 233, 0.1); color: var(--accent-color); border-color: rgba(14, 165, 233, 0.2); }

        /* Timeline Experience */
        .timeline { position: relative; margin-left: 1rem; padding-left: 2.5rem; border-left: 3px solid var(--accent-color); }
        .timeline-item { position: relative; margin-bottom: 3rem; }
        .timeline-item::before {
            content: ''; position: absolute; left: -3.15rem; top: 0; width: 22px; height: 22px; border-radius: 50%;
            background: var(--accent-color); border: 4px solid var(--bg-color); box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.2);
        }
        .experience-card {
            background: var(--card-bg); padding: 2.5rem; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }
        .experience-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
        .experience-header h4 { font-size: 1.5rem; color: var(--primary-color); line-height: 1.2; font-weight: 700; }
        .experience-header .date {
            color: var(--accent-color); font-weight: 700; background: rgba(14, 165, 233, 0.1); padding: 0.4rem 1rem;
            border-radius: 9999px; font-size: 0.9rem; font-family: 'Poppins', sans-serif; white-space: nowrap; display: inline-block;
        }
        .company { font-weight: 700; color: var(--secondary-color); margin-bottom: 0.25rem; display: block; font-size: 1.15rem; }
        a.company { text-decoration: none; transition: color 0.2s ease, text-decoration 0.2s ease; }
        a.company:hover, a.company:focus { color: var(--accent-color); text-decoration: underline; }
        .location { font-size: 0.9rem; color: #64748b; display: block; }
        .section-title { font-weight: 600; color: var(--primary-color); margin-top: 1.5rem; margin-bottom: 0.75rem; font-size: 1.05rem; }
        
        .experience-intro {
            font-style: italic; color: var(--secondary-color); margin-bottom: 1.5rem; font-size: 1rem;
            padding: 1.25rem; background-color: var(--badge-bg); border-radius: 8px; border-left: 4px solid var(--accent-color);
        }
        
        /* Formatage des listes d'expériences */
        ul { padding-left: 1.25rem; margin-bottom: 1.5rem; }
        li { margin-bottom: 0.5rem; color: var(--text-color); }
        li::marker { color: var(--accent-color); }
        li ul { margin-top: 0.5rem; margin-bottom: 0.75rem; padding-left: 0.5rem; list-style-type: none; }
        li ul li { font-size: 0.95rem; margin-bottom: 0.35rem; position: relative; padding-left: 1.25rem; }
        li ul li::before { content: "•"; color: var(--accent-color); position: absolute; left: 0; top: 0; font-weight: bold; font-size: 1.25rem; line-height: 1.2; }
        
        .env-box {
            margin-top: 1.5rem; padding: 1.25rem; background-color: var(--badge-bg); border-radius: 8px;
            border-left: 4px solid var(--accent-color); font-size: 0.95rem; line-height: 1.5;
        }
        .env-box strong { color: var(--primary-color); }

        /* Bouton flottant de contact (FAB) */
        .fab {
            position: fixed; bottom: 2rem; right: 2rem; width: 65px; height: 65px; background-color: var(--accent-color);
            color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.5); text-decoration: none; z-index: 1000; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer; border: none;
        }
        .fab:hover { transform: scale(1.1) translateY(-5px); background-color: #0284c7; }

        /* Pied de page */
        footer { text-align: center; padding: 3rem 1.5rem; background: var(--header-bg); color: rgba(255, 255, 255, 0.7); margin-top: 5rem; }
        .admin-link { color: rgba(255,255,255,0.4); text-decoration: none; font-size: 0.8rem; cursor: pointer; margin-top: 10px; display: inline-block; }
        [contenteditable="true"] { outline: 2px dashed var(--accent-color); outline-offset: 10px; background-color: rgba(14, 165, 233, 0.05); border-radius: 8px; padding: 10px; }

        /* Mobile */
        @media (max-width: 768px) {
            nav { padding: 1rem; } .nav-links { display: none; }
            header h1 { font-size: 2.25rem; } header h2 { font-size: 1.25rem; }
            .header-buttons { flex-direction: column; width: 100%; } .btn { width: 100%; justify-content: center; }
            .kpi-banner { margin: -2rem 1rem 3rem; grid-template-columns: 1fr 1fr; padding: 1.5rem; }
            .timeline { margin-left: 0; padding-left: 1.5rem; } .timeline-item::before { left: -1.9rem; width: 16px; height: 16px; }
            .experience-card { padding: 1.5rem; } .fab { bottom: 1.5rem; right: 1.5rem; width: 55px; height: 55px; }
        }
        /* Impression */
        @media print {
            body { background: white; color: black; } nav, .fab, .header-buttons, .kpi-banner, .admin-link, #case-studies { display: none; }
            header { background: white; color: black; padding: 2rem 0; } header h1 { color: black; } header h2 { color: #555; }
            .contact-info a { color: black; border-bottom: none; } .profile-photo { border: 2px solid #ccc; box-shadow: none; width: 120px; height: 120px; }
            .container { max-width: 100% !important; margin: 0; padding: 0; } .experience-card { border: none; padding: 0; box-shadow: none; margin-bottom: 2rem; page-break-inside: avoid; }
            .timeline { border-left: none; padding-left: 0; margin-left: 0; } .timeline-item::before { display: none; }
        }
    </style>
</head>
