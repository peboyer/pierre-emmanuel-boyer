<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erreur 404 - Page introuvable</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0f172a; --accent-color: #0ea5e9;
            --bg-color: #f8fafc; --text-color: #334155;
            --header-bg: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        body.dark-mode {
            --primary-color: #38bdf8; --accent-color: #0ea5e9;
            --bg-color: #0f172a; --text-color: #cbd5e1;
            --header-bg: linear-gradient(135deg, #020617 0%, #0f172a 100%);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; color: var(--text-color); background-color: var(--bg-color); display: flex; flex-direction: column; min-height: 100vh; text-align: center; }
        header { background: var(--header-bg); color: white; padding: 6rem 1.5rem; flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        h1 { font-family: 'Poppins', sans-serif; font-size: 8rem; font-weight: 800; margin-bottom: 0; line-height: 1; text-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { font-family: 'Poppins', sans-serif; color: var(--accent-color); font-size: 2rem; margin-bottom: 1.5rem; }
        p { font-size: 1.2rem; max-width: 600px; margin: 0 auto 3rem auto; opacity: 0.9; }
        .btn { background-color: var(--accent-color); color: white; padding: 1rem 2.5rem; border-radius: 9999px; text-decoration: none; font-weight: 600; transition: all 0.3s; display: inline-flex; align-items: center; gap: 0.5rem; }
        .btn:hover { transform: translateY(-3px); background-color: #0284c7; box-shadow: 0 10px 20px rgba(14, 165, 233, 0.3); }
    </style>
</head>
<body>
    <header>
        <h1>404</h1>
        <h2>Infrastructure introuvable</h2>
        <p>Le serveur n'a pas pu trouver la page que vous cherchez. La route réseau a probablement changé ou le service a été décommissionné.</p>
        <a href="index.html" class="btn">⬅️ Revenir au Portfolio</a>
    </header>
    <script>
        // Applique le mode sombre si configuré dans le localStorage
        if(localStorage.getItem('theme') === 'dark' || document.body.classList.contains('dark-mode')) {
            document.body.classList.add('dark-mode');
        }
    </script>
</body>
</html>
